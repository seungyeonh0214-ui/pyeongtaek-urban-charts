  const body = rows.map(([k, v1, v2, dec, unit]) => {

    const op = Math.max(.22, 1 - k * .14), large = a1 - a0 > Math.PI ? 1 : 0;
    const P = (a, rad) => [cx + Math.cos(a) * rad, cy + Math.sin(a) * rad];
    const [x0, y0] = P(a0, R), [x1, y1] = P(a1, R), [x2, y2] = P(a1, r), [x3, y3] = P(a0, r);
    out.push(`<path d="M${x0} ${y0} A${R} ${R} 0 ${large} 1 ${x1} ${y1} L${x2} ${y2}
      A${r} ${r} 0 ${large} 0 ${x3} ${y3} Z" fill="${css(COLORS[i])}" fill-opacity="${op}"
      stroke="${css("--panel")}" stroke-width="1.3"/>`);
    leg.push(`<span><i class="sw" style="background:${css(COLORS[i])};opacity:${op}"></i>${esc(d[0])} ${fmt(d[1])} (${(frac * 100).toFixed(1)}%)</span>`);
    a0 = a1;
  });
  out.push(`<text x="${cx}" y="${cy - 3}" text-anchor="middle" font-size="16" font-weight="600" fill="${css("--ink")}">${fmt(total)}</text>`);
  out.push(`<text x="${cx}" y="${cy + 13}" text-anchor="middle" font-size="9" fill="${css("--mute")}">전체 건수</text>`);
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.setAttribute("height", h);
  svg.innerHTML = out.join("");
  legend.innerHTML = leg.join("");
}

function drawMap(i, d) {
  const svg = $("map" + i), legend = $("mapLeg" + i);
  if (!svg) return;
  const w = svg.clientWidth || 340;
  const [x0, y0, x1, y1] = d.bbox;
  const k = Math.cos((y0 + y1) / 2 * Math.PI / 180);
  const spanX = (x1 - x0) * k || 1e-6, spanY = (y1 - y0) || 1e-6, pad = 6;
  const h = Math.max(180, Math.min(360, Math.round((w - 2 * pad) * (spanY / spanX)) + 2 * pad));
  const sc = Math.min((w - 2 * pad) / spanX, (h - 2 * pad - 16) / spanY);
  const offX = (w - spanX * sc) / 2, offY = (h - 16 - spanY * sc) / 2;
  const px = (lon) => offX + (lon - x0) * k * sc;
  const py = (lat) => h - 16 - offY - (lat - y0) * sc;
  const out = [];
  d.ring.forEach((ring) => out.push(
    `<path d="${ring.map((p, n) => (n ? "L" : "M") + px(p[0]).toFixed(1) + "," + py(p[1]).toFixed(1)).join("")}Z"
      fill="${css(COLORS[i])}" fill-opacity=".1" stroke="${css("--line")}" stroke-width="1"/>`));
  const maxA = Math.max(1, ...d.parks.map((p) => p.a));
  d.parks.forEach((p) => {
    const rr = 1.5 + 6.5 * Math.sqrt(p.a / maxA);
    out.push(`<circle cx="${px(p.x).toFixed(1)}" cy="${py(p.y).toFixed(1)}" r="${rr.toFixed(1)}"
      fill="${css(COLORS[i])}" fill-opacity="${p.e === "미집행" ? .9 : .5}" stroke="${css("--panel")}" stroke-width=".5"
      ><title>${esc(p.n)} · ${esc(p.t)} · ${esc(p.e)} · ${fmt(p.a)} ㎡</title></circle>`);
  });
  const mPerPx = 111320 / sc;
  const target = (w - 2 * pad) * 0.28 * mPerPx;
  const unit = [100, 200, 500, 1000, 2000, 5000, 10000].reduce((p, q) =>
    (Math.abs(q - target) < Math.abs(p - target) ? q : p));
  const barPx = unit / mPerPx;
  out.push(`<line x1="${pad}" x2="${pad + barPx}" y1="${h - 7}" y2="${h - 7}" stroke="${css("--mute")}" stroke-width="2"/>`);
  out.push(`<text x="${pad + barPx + 5}" y="${h - 4}" font-size="9" fill="${css("--mute")}">${unit >= 1000 ? (unit / 1000) + " km" : unit + " m"}</text>`);
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.setAttribute("height", h);
  svg.innerHTML = out.join("");
  legend.innerHTML =
    `<span><i class="sw" style="background:${css(COLORS[i])};opacity:.9"></i>미집행</span>` +
    `<span><i class="sw" style="background:${css(COLORS[i])};opacity:.5"></i>집행완료·기타</span>` +
    `<span>공원 ${fmt(d.parks.length)}곳</span>`;
}

draw();
addEventListener("resize", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
</script>
</body>
</html>
