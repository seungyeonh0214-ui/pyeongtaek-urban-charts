<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>평택시 미집행 도시계획시설 — 차트 2종</title>
<style>
  :root{
    --bg:#ffffff; --panel:#f7f9fc; --line:#d8dde6;
    --ink:#1b1f27; --mute:#5c6472;
    --accent:#1f3f77; --accent-soft:#9fb3d4; --warn:#a3561b;
    --max:60rem;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#15181d; --panel:#1d2229; --line:#333a45;
           --ink:#e9ecf1; --mute:#9aa3b2; --accent:#7ea3dd; --accent-soft:#3c536f;
           --warn:#d79a5e; color-scheme:dark; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.6 "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;}
  .wrap{max-width:var(--max);margin-inline:auto;padding:24px 16px 48px;}
  header h1{font-size:1.45rem;line-height:1.3;margin:0 0 6px;text-wrap:balance}
  header p{margin:0;color:var(--mute);font-size:.86rem}
  .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:.78rem;color:var(--mute)}
  .meta code{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:.92em}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        padding:18px 16px;margin-top:22px}
  .card h2{font-size:1.05rem;margin:0 0 2px}
  .card .sub{margin:0 0 4px;color:var(--mute);font-size:.82rem}
  .axis-note{margin:0 0 12px;color:var(--mute);font-size:.76rem}
  figure{margin:0}
  figcaption{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);
             color:var(--mute);font-size:.74rem;line-height:1.55}
  figcaption b{color:var(--ink);font-weight:600}
  svg{display:block;width:100%;height:auto;overflow:visible}
  .hl{color:var(--warn);font-weight:600}
  .legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:.78rem}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .sw{width:.7rem;height:.7rem;border-radius:2px;display:inline-block}
  .tbl{width:100%;border-collapse:collapse;margin-top:12px;font-size:.78rem}
  .tbl th,.tbl td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
  .tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
  footer{margin-top:28px;color:var(--mute);font-size:.74rem;line-height:1.6}
  @media (max-width:520px){
    .wrap{padding:18px 14px 36px}
    header h1{font-size:1.2rem}
    .card{padding:14px 12px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>평택시 미집행 도시계획시설 — 차트 2종</h1>
    <p>브이월드 2D 데이터 API 2.0으로 받은 레이어를 카탈로그 행 기준으로 집계했습니다.</p>
    <div class="meta">
      <span>조회일 <code>2026-10-12</code></span>
      <span>좌표계 <code>EPSG:4326</code></span>
      <span>대상 <code>평택시 sig_cd 41220</code></span>
    </div>
  </header>

  <!-- 차트 A — 비교(막대), 필수 -->
  <section class="card">
    <figure>
      <h2>차트 A · 읍면동별 미집행 공원 결정면적</h2>
      <p class="sub">항목 간 크기 비교 — 상위 8개 읍면동</p>
      <p class="axis-note">가로축 결정면적(ha) · 세로축 읍면동</p>
      <svg id="bar" role="img" aria-label="읍면동별 미집행 공원 결정면적 막대그래프"></svg>
      <figcaption>
        <b>단위</b> ha(헥타르), 괄호 안은 공원 개소<br>
        <b>출처</b> 브이월드 2D 데이터 API 2.0 · LT_C_UPISUQ153 도시계획시설 — 카탈로그 D-1행 ·
        읍면동 귀속은 LT_C_ADEMD_INFO(카탈로그 D-4행) 대표점 기준<br>
        <b>조회일</b> 2026-10-12<br>
        <b>강조</b> <span class="hl">고덕동</span> — 107.9 ha로 2위 진위면(50.7 ha)의 두 배를 넘습니다.
      </figcaption>
    </figure>
  </section>

  <!-- 차트 B — 구성(도넛), 선택 -->
  <section class="card">
    <figure>
      <h2>차트 B · 도시계획시설 대분류 구성비</h2>
      <p class="sub">전체 1,529건의 부분 비중</p>
      <p class="axis-note">기준 대분류(lcl_nam) 건수 — 전체 합 100%</p>
      <svg id="donut" role="img" aria-label="도시계획시설 대분류 구성비 도넛그래프"></svg>
      <div class="legend" id="legend"></div>
      <table class="tbl" id="tbl">
        <thead><tr><th>대분류</th><th class="n">건수</th><th class="n">구성비</th></tr></thead>
        <tbody></tbody>
      </table>
      <figcaption>
        <b>단위</b> 건(결정 건수), %는 전체 1,529건 대비 구성비<br>
        <b>출처</b> 브이월드 2D 데이터 API 2.0 · LT_C_UPISUQ153 도시계획시설 — 카탈로그 D-1행<br>
        <b>조회일</b> 2026-10-12<br>
        <b>강조</b> <span class="hl">공원</span> — 469건, 전체의 30.7%로 녹지에 이어 두 번째입니다.
      </figcaption>
    </figure>
  </section>

  <footer>
    값은 모두 카탈로그 행에서 가져왔습니다. 시설의 읍면동 귀속과 평택시 경계 클리핑은 대표점 기준이라,
    경계를 걸치는 시설은 대표점 위치에 따라 포함 여부가 갈립니다.<br>
    인증키는 환경변수로만 주입하며 이 저장소의 어떤 파일에도 들어 있지 않습니다.
  </footer>
</div>

<script>
const BAR = [
  ["고덕동", 107.9, 29], ["진위면", 50.7, 14], ["포승읍", 48.1, 11], ["고덕면", 28.8, 8],
  ["죽백동", 27.7, 1], ["비전동", 21.6, 20], ["서정동", 19.0, 12], ["팽성읍", 17.6, 23]
];
const DONUT = [
  ["녹지", 773], ["공원", 469], ["공공공지", 191], ["광장", 93],
  ["기타도시공간시설", 2], ["미분류", 1]
];
const HL_BAR = "고덕동", HL_DONUT = "공원";
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function drawBar() {
  const svg = document.getElementById("bar");
  const w = svg.clientWidth || 640;
  const narrow = w < 420;
  const labelW = narrow ? 52 : 62;
  const m = { top: 6, right: narrow ? 52 : 66, bottom: 26, left: labelW };
  const rowH = narrow ? 30 : 34;
  const h = m.top + m.bottom + BAR.length * rowH;
  const max = Math.max(...BAR.map((d) => d[1]));
  const plot = w - m.left - m.right;
  const x = (v) => m.left + (v / max) * plot;

  const parts = [];
  const ticks = [0, 30, 60, 90, 120].filter((t) => t <= max * 1.05);
  ticks.forEach((t) => {
    parts.push(`<line x1="${x(t)}" x2="${x(t)}" y1="${m.top}" y2="${h - m.bottom}"
      stroke="${css("--line")}" stroke-width="1"/>`);
    parts.push(`<text x="${x(t)}" y="${h - m.bottom + 15}" text-anchor="middle"
      font-size="10" fill="${css("--mute")}">${t}</text>`);
  });
  parts.push(`<text x="${w - m.right}" y="${h - m.bottom + 15}" text-anchor="end"
    font-size="10" fill="${css("--mute")}">ha</text>`);

  BAR.forEach((d, i) => {
    const [name, ha, cnt] = d;
    const y = m.top + i * rowH + 4;
    const bh = rowH - 12;
    const on = name === HL_BAR;
    parts.push(`<rect x="${m.left}" y="${y}" width="${Math.max(2, x(ha) - m.left)}"
      height="${bh}" rx="3" fill="${on ? css("--warn") : css("--accent")}"
      fill-opacity="${on ? 1 : 0.78}"/>`);
    parts.push(`<text x="${m.left - 6}" y="${y + bh / 2}" dy="0.35em" text-anchor="end"
      font-size="${narrow ? 10 : 11}" font-weight="${on ? 700 : 400}"
      fill="${on ? css("--warn") : css("--ink")}">${name}</text>`);
    parts.push(`<text x="${x(ha) + 6}" y="${y + bh / 2}" dy="0.35em"
      font-size="${narrow ? 9.5 : 10.5}" fill="${css("--mute")}">${ha.toFixed(1)}${narrow ? "" : " ("+cnt+"곳)"}</text>`);
  });
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.setAttribute("height", h);
  svg.innerHTML = parts.join("");
}

function drawDonut() {
  const svg = document.getElementById("donut");
  const w = svg.clientWidth || 640;
  const size = Math.min(w, 300);
  const h = size;
  const cx = w / 2, cy = h / 2;
  const R = size * 0.42, r = size * 0.25;
  const total = DONUT.reduce((s, d) => s + d[1], 0);
  const base = css("--accent"), soft = css("--accent-soft"), warn = css("--warn");
  const shades = [0.95, 0, 0.6, 0.42, 0.3, 0.22];

  let a0 = -Math.PI / 2;
  const parts = [], legend = [], rows = [];
  DONUT.forEach((d, i) => {
    const [name, v] = d;
    const frac = v / total;
    const a1 = a0 + frac * Math.PI * 2;
    const on = name === HL_DONUT;
    const fill = on ? warn : (i === 0 ? base : soft);
    const op = on ? 1 : (i === 0 ? 0.9 : Math.max(0.3, shades[i] || 0.3));
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const p = (ang, rad) => [cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad];
    const [x0, y0] = p(a0, R), [x1, y1] = p(a1, R), [x2, y2] = p(a1, r), [x3, y3] = p(a0, r);
    parts.push(`<path d="M${x0} ${y0} A${R} ${R} 0 ${large} 1 ${x1} ${y1}
      L${x2} ${y2} A${r} ${r} 0 ${large} 0 ${x3} ${y3} Z"
      fill="${fill}" fill-opacity="${op}" stroke="${css("--panel")}" stroke-width="1.5"/>`);
    legend.push(`<span><i class="sw" style="background:${fill};opacity:${op}"></i>${name}</span>`);
    rows.push(`<tr><td${on ? ' class="hl"' : ""}>${name}</td><td class="n">${v.toLocaleString()}</td>
      <td class="n">${(frac * 100).toFixed(1)}%</td></tr>`);
    a0 = a1;
  });
  parts.push(`<text x="${cx}" y="${cy - 6}" text-anchor="middle" font-size="20"
    font-weight="600" fill="${css("--ink")}">1,529</text>`);
  parts.push(`<text x="${cx}" y="${cy + 14}" text-anchor="middle" font-size="10.5"
    fill="${css("--mute")}">전체 건수</text>`);
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.setAttribute("height", h);
  svg.innerHTML = parts.join("");
  document.getElementById("legend").innerHTML = legend.join("");
  document.querySelector("#tbl tbody").innerHTML = rows.join("");
}

function draw() { drawBar(); drawDonut(); }
draw();
addEventListener("resize", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
</script>
</body>
</html>
